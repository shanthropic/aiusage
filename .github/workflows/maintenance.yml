name: Prepare dependency locks
on:
  push:
    branches: [feat/restore-rust-core]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: cargo generate-lockfile --manifest-path crates/core/Cargo.toml
      - run: cargo fmt --manifest-path crates/core/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-source
          path: |
            pnpm-lock.yaml
            crates/core/Cargo.lock
            crates/core/src/
