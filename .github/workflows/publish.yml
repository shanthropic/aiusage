name: Release packages
on:
  push:
    tags: ['tokenstat-v*']
  pull_request:
    branches: [rust]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/') && 'npm' || github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const p = JSON.parse(readFileSync('package.json'))
          assert.equal(process.env.GITHUB_REPOSITORY, 'shanthropic/tokenstat')
          assert.equal(p.name, 'tokenstat')
          assert.match(p.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)
          if (process.env.GITHUB_REF.startsWith('refs/tags/')) assert.equal(process.env.RELEASE_TAG, `tokenstat-v${p.version}`)
          JS
      - name: Require release commit on rust
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/rust
  validate:
    needs: guard
    uses: ./.github/workflows/ci.yml
  pack:
    needs: validate
    runs-on: ubuntu-22.04
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: artifacts
      - run: pnpm build:js
      - run: node scripts/pack-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: tarballs/
          if-no-files-found: error
          retention-days: 30
  install:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.22.1', '26']
        platform:
          - { runner: ubuntu-22.04, name: linux-x64-gnu }
          - { runner: ubuntu-22.04-arm, name: linux-arm64-gnu }
          - { runner: macos-15-intel, name: darwin-x64 }
          - { runner: macos-15, name: darwin-arm64 }
          - { runner: windows-2025, name: win32-x64-msvc }
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: tarballs
      - name: Install unchanged tarballs outside the checkout
        env:
          PLATFORM: ${{ matrix.platform.name }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          ROOT="$PWD"
          mkdir -p "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/consumer-home"
          export HOME="$RUNNER_TEMP/consumer-home"
          export USERPROFILE="$HOME"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$ROOT"/tarballs/tokenstat-*.tgz "$ROOT"/tarballs/shanthropic-tokenstat-"$PLATFORM"-*.tgz
          npm exec --offline -- tokenstat --help
          npm exec --offline -- tokenstat cache --help
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readdirSync } from 'node:fs'
          import { createRequire } from 'node:module'
          const require = createRequire(process.cwd() + '/node_modules/tokenstat/package.json')
          const p = require('./package.json')
          assert.deepEqual(readdirSync('node_modules/@shanthropic'), [`tokenstat-${process.env.PLATFORM}`])
          assert.equal(require(`@shanthropic/tokenstat-${process.env.PLATFORM}/package.json`).version, p.version)
          const { Resvg } = require('@resvg/resvg-js')
          assert(new Resvg('<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"/>').render().asPng().length > 0)
          JS
          du -sk node_modules "$npm_config_cache" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: install
    if: github.repository == 'shanthropic/tokenstat' && startsWith(github.ref, 'refs/tags/tokenstat-v')
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: tarballs
      - run: node scripts/publish-release.mjs
  registry:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, name: linux-x64-gnu }
          - { runner: ubuntu-22.04-arm, name: linux-arm64-gnu }
          - { runner: macos-15-intel, name: darwin-x64 }
          - { runner: macos-15, name: darwin-arm64 }
          - { runner: windows-2025, name: win32-x64-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Verify real npx platform selection
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
          npm_config_cache: ${{ runner.temp }}/registry-cache
        run: |
          VERSION="${TAG#tokenstat-v}"
          npx --yes "tokenstat@$VERSION" --help
          find "$npm_config_cache/_npx" -path '*/node_modules/@shanthropic/tokenstat-*/package.json' > installed.txt
          test "$(wc -l < installed.txt | tr -d ' ')" = 1
          grep -F "/tokenstat-$PLATFORM/package.json" installed.txt
