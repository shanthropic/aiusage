[package]
name = "mytokens-core"
version = "1.3.4"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2.8"
napi = { version = "3.5", default-features = false, features = ["async", "napi8"] }
napi-derive = "3.5"
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[build-dependencies]
napi-build = "2.3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
